        action: INSERT_OR_UPDATE
      active: "true"
      copied_from: ""
      description: "The decision logic only (no records): which level is asked when,
        and what a join, a decline or a stale reply does.\r

        \r

        Checks that:\r

        - starts at level 1 and requests only that level\r

        - a join stops the run and requests nothing else, however long
        it waits\r

        - a decline requests the next level immediately\r

        - a cancelled request counts as a decline\r

        - a level with two people waits until both decline, and stops
        when either joins\r

        - ignores a reply from someone who is not on the current level\r

        - ignores a reply that predates the request it would answer\r

        - starts over whatever happened before: asks A, then B, then C
        even though A had declined earlier"
      enable_parameterized_testing: "false"
      fail_on_server_error: "true"
