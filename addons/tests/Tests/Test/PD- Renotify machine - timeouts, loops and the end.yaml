        action: INSERT_OR_UPDATE
      active: "true"
      copied_from: ""
      description: "The decision logic only: level delays, the policy's loops,
        exhaustion, shift changes, and when a level counts as due.\r

        \r

        Checks that:\r

        - moves on only after the level delay\r

        - repeats the levels for the policy's loops and then is
        exhausted: 3 levels x (1 + 3 loops) = 12 requests\r

        - a policy with no rules is exhausted at once\r

        - resolves the people on call when each level is reached, so a
        shift change counts\r

        - skips a level with nobody on call\r

        - stops when the incident is resolved\r

        - counts a level as due when its delay expired, not when the
        timer noticed\r

        - counts a level as due when PagerDuty stamped the decline,
        unless that is missing or in the future"
