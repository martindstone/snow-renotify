        action: INSERT_OR_UPDATE
      active: "true"
      copied_from: ""
      description: "PagerDuty failures, Stop, and renotifying one person.\r

        \r

        Checks that:\r

        - a PagerDuty failure on start is reported and the run is marked
        failed\r

        - when PagerDuty refuses the on-calls request, the failure
        points at the oncalls.read OAuth scope\r

        - other on-calls failures do not mention the scope\r

        - a failure on a later level marks the run failed and stops it\r

        - cancel stops an active run and nothing more is requested\r

        - cancel of a run that has already ended changes nothing\r

        - renotifying one person requests just them, as the user who
        clicked, and starts no run\r

        - renotifying yourself is requested on behalf of another user,
        because PagerDuty ignores a request you make of yourself\r

        - renotifying one person needs a person, and checks what start
        checks\r

        - renotifying one person reports a PagerDuty failure"
      enable_parameterized_testing: "false"
      fail_on_server_error: "true"
      name: "PD: Renotify run - failures, stopping and single people"
