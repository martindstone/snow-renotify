      active: "true"
      copied_from: ""
      description: "Not asking again someone PagerDuty has just asked, while still
        waiting for their answer.\r

        \r

        Checks that:\r

        - does not ask again someone PagerDuty asked itself just as the
        level became due, but still waits for their answer\r

        - asks someone whose pending request is older than the moment
        the level became due\r

        - asks again someone PagerDuty asked before the click: that is
        what Renotify is for\r

        - skips only the people already asked in a level with several\r

        - asks someone who has already answered\r

        - uses the moment the delay expired, not when the timer noticed,
        when a level times out\r

        - asks everyone when PagerDuty cannot be read\r

        - never skips the one-off renotify of a person"
      enable_parameterized_testing: "false"
      fail_on_server_error: "true"
