        action: INSERT_OR_UPDATE
      active: "true"
      copied_from: ""
      description: "A run in the real table: declines, duplicate deliveries, joins,
        the level delay, loops, exhaustion, resolution and recovery.\r

        \r

        Checks that:\r

        - a decline queues the follow-up, and running it requests level
        2 once\r

        - a duplicate delivery of the same webhook does not request
        level 2 twice\r

        - two people on a level replying before the follow-up runs still
        advance exactly once\r

        - a join stops the run and nothing more is ever requested\r

        - ignores a reply that predates the request it would answer\r

        - moves to the next level only after the level's delay has
        passed\r

        - resolves the people on call when the level is reached (a shift
        change)\r

        - a run that times out on its last level is saved as exhausted
        and stops being active\r

        - repeats the policy for its loops before it is exhausted\r

        - a tick that changes nothing does not rewrite the run\r

        - the incident being resolved ends the run\r

        - purges finished runs after the retention period, never an
        active run or a young one\r

        - a tick recovers a run left waiting after a follow-up that
        claimed its work and died"
      enable_parameterized_testing: "false"
      fail_on_server_error: "true"
      name: "PD: Renotify run - replies, timeouts and the end"
